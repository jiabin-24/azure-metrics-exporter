apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-metrics-scraper
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: azure-metrics-scraper
  template:
    metadata:
      labels:
        app: azure-metrics-scraper
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scraper
          image: niuai/azure-metrics-scraper:main
          imagePullPolicy: IfNotPresent
          command: ["/azure-metrics-scraper"]
          args:
            - --config.file=/etc/azure-metrics-scraper/scraper.yaml
            - --web.listen-address=:8081
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCRAPER_CLUSTER_ADVERTISE_ADDRESS
              value: "$(POD_IP):7946"
            - name: AZURE_EVENTHUB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-metrics-eventhub
                  key: connection-string
          ports:
            - name: health
              containerPort: 8081
            - name: gossip-tcp
              containerPort: 7946
              protocol: TCP
            - name: gossip-udp
              containerPort: 7946
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/azure-metrics-scraper
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: azure-metrics-scraper
---
apiVersion: v1
kind: Service
metadata:
  name: azure-metrics-scraper-gossip
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: azure-metrics-scraper
  ports:
    - name: gossip-tcp
      port: 7946
      targetPort: gossip-tcp
      protocol: TCP
    - name: gossip-udp
      port: 7946
      targetPort: gossip-udp
      protocol: UDP
