apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-metrics-scraper
data:
  scraper.yaml: |
    global:
      scrape_interval: 1m
      scrape_timeout: 30s
    cluster:
      name: azure-metrics-scraper
      bind_address: 0.0.0.0:7946
      join: ["azure-metrics-scraper-gossip:7946"]
    event_hub:
      namespace: shein-aks-metrics.servicebus.windows.net
      name: shein-aks-metrics
    scrape_configs:
      - job_name: azure-control-plane
        # Automatically collects every workspace configured in the exporter.
        metrics_path: /probe/metrics/promql
        honor_timestamps: true
        rolling_range:
          window: 1m
          step: 15s
          delay: 0s
        params:
          query: ["apiserver_request_total"]
          format: ["json"]
          # For ingestion lag, set rolling_range.delay; do not add params.query_delay.
        static_configs:
          - targets: ["azure-metrics:8080"]
            labels:
              environment: production
      # Platform JSON jobs may share this Event Hub; see scraper/README.md.
      # Replace subscription/resource placeholders before adding a platform job.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-metrics-scraper
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: azure-metrics-scraper
  template:
    metadata:
      labels:
        app: azure-metrics-scraper
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scraper
          # Build and publish the updated repository image before applying.
          image: azure-metrics-scraper:local
          imagePullPolicy: IfNotPresent
          command: ["/azure-metrics-scraper"]
          args:
            - --config.file=/etc/azure-metrics-scraper/scraper.yaml
            - --web.listen-address=:8081
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCRAPER_CLUSTER_ADVERTISE_ADDRESS
              value: "$(POD_IP):7946"
            - name: AZURE_EVENTHUB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-metrics-eventhub
                  key: connection-string
          ports:
            - name: health
              containerPort: 8081
            - name: gossip-tcp
              containerPort: 7946
              protocol: TCP
            - name: gossip-udp
              containerPort: 7946
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/azure-metrics-scraper
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: azure-metrics-scraper
---
apiVersion: v1
kind: Service
metadata:
  name: azure-metrics-scraper-gossip
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: azure-metrics-scraper
  ports:
    - name: gossip-tcp
      port: 7946
      targetPort: gossip-tcp
      protocol: TCP
    - name: gossip-udp
      port: 7946
      targetPort: gossip-udp
      protocol: UDP
