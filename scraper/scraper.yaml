global:
  scrape_interval: 1m
  scrape_timeout: 30s

# Omit cluster for standalone mode. Enable it on every cooperating instance.
# cluster:
#   name: azure-metrics-scraper
#   bind_address: 0.0.0.0:7946
#   join: ["<seed-host>:7946"]

event_hub:
  namespace: shein-aks-metrics.servicebus.windows.net
  name: shein-aks-metrics

scrape_configs:
  - job_name: azure-control-plane
    # Aliases must exist in the exporter workspace configuration.
    workspaces: ["workspace-a"]
    metrics_path: /probe/metrics/promql
    honor_timestamps: true
    # 每次抓取查询 [当前时间-delay-window, 当前时间-delay]，不按整分钟取整。
    rolling_range:
      window: 1m
      step: 15s
      delay: 0s
    params:
      query: ["apiserver_request_total"]
      # 返回完整窗口及源采样时间。
      format: ["json"]
      # 即时查询：先移除 rolling_range；query_delay 不能与范围参数同时使用。
      # query_delay: ["20m"]
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          environment: development

  # /metrics 文本任务仅适用于未配置 event_hub 的独立采集器。
  # - job_name: exporter-self
  #   scrape_interval: 30s
  #   scrape_timeout: 5s
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["127.0.0.1:8080"]

  # 平台指标可与上述 PromQL 任务推送到同一 Event Hub。
  # 填写真实订阅及资源 ID 后再取消注释；其他平台端点示例见 README.md。
  # - job_name: azure-platform-window
  #   metrics_path: /probe/metrics/resource
  #   params:
  #     subscription: ["<subscription-id>"]
  #     target: ["/subscriptions/<subscription-id>/resourceGroups/<resource-group>/providers/Microsoft.Compute/virtualMachines/<vm>"]
  #     metric: ["Percentage CPU"]
  #     aggregation: ["average"]
  #     timespan: ["PT3M"]
  #     interval: ["PT1M"]
  #     format: ["json"]
  #   static_configs:
  #     - targets: ["127.0.0.1:8080"]
